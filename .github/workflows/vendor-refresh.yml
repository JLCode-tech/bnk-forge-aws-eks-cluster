name: vendor-refresh

on:
  # Safety-net cron: catches anything missed by repository_dispatch.
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

  # Manual trigger from the Actions UI, optionally overriding the upstream ref.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'bnk-forge-modules ref to vendor from (default: release branch matching current branch)'
        required: false
        default: ''

  # Triggered by bnk-forge-modules pushing to a release branch.
  # The dispatching workflow lives in bnk-forge-modules/.github/workflows/notify-downstream.yml.
  repository_dispatch:
    types: [bnk-forge-modules-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Determine upstream ref
        id: ref
        run: |
          # Priority: workflow_dispatch input > repository_dispatch payload > current branch
          if [[ -n "${{ inputs.upstream_ref }}" ]]; then
            REF="${{ inputs.upstream_ref }}"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            REF="${{ github.event.client_payload.ref || 'release/2.2' }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Vendoring from: $REF"

      - name: Run vendor-refresh
        env:
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: ./scripts/vendor-refresh.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected — vendored copies match upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected, will open PR."
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            chore: vendor-refresh from bnk-forge-modules@${{ steps.ref.outputs.ref }}

            Auto-generated by .github/workflows/vendor-refresh.yml.
            Pin recorded in VENDORED.pin.
          title: 'chore: vendor-refresh from bnk-forge-modules@${{ steps.ref.outputs.ref }}'
          body: |
            Automated vendor refresh from [`JLCode-tech/bnk-forge-modules`](https://github.com/JLCode-tech/bnk-forge-modules) at ref `${{ steps.ref.outputs.ref }}`.

            See [`VENDORED.md`](./VENDORED.md) for how vendored modules work in this repo.
            See [`VENDORED.pin`](./VENDORED.pin) for the resolved upstream commit.

            **Review checklist:**
            - [ ] Inspect `modules/eks-cluster-install-*` diffs — should be a clean upstream sync.
            - [ ] Confirm `VENDORED.pin` reflects the expected ref + commit.
            - [ ] No unrelated changes outside `modules/` and `VENDORED.pin`.
          branch: vendor-refresh/${{ steps.ref.outputs.ref }}
          delete-branch: true
          labels: |
            vendor-refresh
            automated
